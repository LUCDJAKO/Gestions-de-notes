<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GestiNotes — Synthèse & Bulletin</title>
  <style>
    :root {
      --green: #1b5e20;
      --green-2: #2e7d32;
      --gold: #c9a227;
      --bg: #edf7ee;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #5f6b63;
      --line: #dfeadf;
      --accent: #e8f5e9;
      --shadow: rgba(28, 76, 38, 0.12);
      --danger: #c62828;
      --warning: #f2a900;
      --blue: #1565c0;
      --blue-soft: #e3f2fd;
      --success-bg: #e8f5e9;
      --success-fg: #1b5e20;
      --warn-bg: #fff8e1;
      --warn-fg: #8a6d00;
      --danger-bg: #ffebee;
      --danger-fg: #b71c1c;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #edf7ee 0%, #eef2ee 100%);
      color: var(--text);
    }

    .topbar {
      background: linear-gradient(135deg, var(--green), var(--green-2));
      color: white;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 5px solid var(--gold);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--gold);
      display: grid;
      place-items: center;
      color: var(--green);
      font-weight: 800;
      font-size: 22px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.12);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 2vw, 1.9rem);
      color: #ffeaa7;
      letter-spacing: 0.02em;
    }

    .subtitle {
      color: rgba(255,255,255,0.8);
      font-size: 12px;
      margin-top: 2px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    button, .file-label {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button:hover, .file-label:hover { transform: translateY(-1px); }
    button:active, .file-label:active { transform: translateY(0); }

    .primary { background: var(--gold); color: #1d1d1d; }
    .secondary { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.25); }
    .blue { background: var(--blue); color: white; }
    .neutral { background: #f2f7f3; color: var(--green); border: 1px solid var(--line); }
    .danger { background: var(--danger); color: white; }

    .wrap {
      max-width: 1220px;
      margin: 20px auto;
      padding: 0 16px 40px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin: 20px 0;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 4px 12px var(--shadow);
      overflow: hidden;
    }

    .card-head {
      padding: 12px 14px;
      background: var(--accent);
      border-bottom: 1px solid var(--line);
      font-weight: 700;
      color: var(--green);
    }

    .card-body {
      padding: 14px;
      font-size: 14px;
    }

    .big-number {
      display: block;
      font-size: clamp(1.7rem, 2vw, 2.3rem);
      font-weight: 800;
      color: var(--green);
      margin-top: 8px;
      line-height: 1.1;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 4px 12px var(--shadow);
      padding: 16px;
      margin-top: 18px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 8px;
    }

    .panel-header h2, .panel-header h3 {
      margin: 0;
      color: var(--green);
    }

    .muted { color: var(--muted); }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background: white;
      overflow: hidden;
      border-radius: 12px;
    }

    th, td {
      padding: 10px 8px;
      text-align: left;
      font-size: 13px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }

    thead th {
      background: #f2fbf3;
      color: var(--green);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    tbody tr:hover { background: #fafefb; }

    .rank-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 46px;
      border-radius: 999px;
      padding: 5px 9px;
      font-weight: 700;
      background: var(--blue-soft);
      color: var(--blue);
    }

    .grade-pill {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 12px;
      white-space: nowrap;
    }

    .grade-very-good { background: var(--success-bg); color: var(--success-fg); }
    .grade-good { background: #e8f5e9; color: var(--green); }
    .grade-medium { background: #fff8e1; color: var(--warn-fg); }
    .grade-low { background: var(--danger-bg); color: var(--danger-fg); }

    .status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #f6faf7;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    .stat {
      background: #f9fbf9;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      min-width: 140px;
      flex: 1 1 140px;
    }

    .stat-label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    .stat-value {
      display: block;
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--green);
      line-height: 1.2;
    }

    .table-wrap {
      overflow: auto;
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .noprint { }
    @media print {
      body { background: white; }
      .topbar, .toolbar, .noprint, .status, .cards { display: none !important; }
      .wrap { max-width: 100%; margin: 0; padding: 0; }
      .panel { box-shadow: none; border: none; padding: 0; }
      th, td { font-size: 11px; }
    }

    @media (max-width: 700px) {
      .topbar { align-items: flex-start; }
      .toolbar { width: 100%; }
      button, .file-label { width: 100%; }
      .table-wrap { border-radius: 8px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">N</div>
      <div>
        <div style="font-size: 11px; opacity: 0.8; letter-spacing: 0.08em; text-transform: uppercase;">Gestion scolaire</div>
        <h1>GestiNotes</h1>
      </div>
    </div>

    <div class="toolbar noprint">
      <button class="secondary" id="reloadBtn">↻ Recharger</button>
      <button class="primary" id="exportCsvBtn">📤 Export CSV</button>
      <button class="blue" id="printBtn">🖨️ Imprimer</button>
      <label class="secondary file-label">
        <input id="importCsvInput" type="file" accept=".csv,text/csv" style="display:none;" />
        📥 Import CSV
      </label>
    </div>
  </header>

  <main class="wrap">
    <section class="cards" id="cards"></section>

    <section class="panel">
      <div class="panel-header">
        <h2>📊 Classement général</h2>
        <div id="sourceInfo" class="muted">Aucune donnée chargée</div>
      </div>
      <div id="leaderboard" class="table-wrap"></div>
      <div id="statusBox" class="status">Chargement des données…</div>
    </section>
  </main>

  <script>
    const STORAGE_KEYS = ['gestinotes_v4', 'gestinotes_v3'];

    function readLocalData() {
      for (const key of STORAGE_KEYS) {
        try {
          const raw = localStorage.getItem(key);
          if (!raw) continue;
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.classes) && parsed.classes.length) {
            return parsed;
          }
        } catch (e) {
          console.warn('Lecture locale impossible :', e);
        }
      }
      return null;
    }

    function avg(values) {
      const nums = values
        .filter((v) => v !== null && v !== undefined && v !== '')
        .map((v) => Number(String(v).replace(',', '.')))
        .filter((v) => !Number.isNaN(v));
      if (!nums.length) return null;
      return Number((nums.reduce((a, b) => a + b, 0) / nums.length).toFixed(2));
    }

    function assessment(value) {
      if (value == null) return '—';
      if (value >= 17) return 'Très bien';
      if (value >= 14) return 'Bien';
      if (value >= 12) return 'Assez bien';
      if (value >= 10) return 'Passable';
      if (value >= 8) return 'Insuffisant';
      if (value >= 5) return 'Très insuffisant';
      return 'Faible';
    }

    function assessmentClass(value) {
      if (value == null) return 'grade-low';
      if (value >= 17) return 'grade-very-good';
      if (value >= 14) return 'grade-good';
      if (value >= 12) return 'grade-good';
      if (value >= 10) return 'grade-medium';
      if (value >= 8) return 'grade-low';
      if (value >= 5) return 'grade-low';
      return 'grade-low';
    }

    function buildRows(data) {
      const rows = [];
      const classes = Array.isArray(data && data.classes) ? data.classes : [];

      classes.forEach((cls) => {
        const students = Array.isArray(cls.students) ? cls.students : [];
        students.forEach((student) => {
          const name = (student && student.name ? student.name.trim() : '').replace(/\s+/g, ' ');
          if (!name) return;

          const v1 = avg((student.notes && student.notes[1]) || []);
          const v2 = avg((student.notes && student.notes[2]) || []);
          const v3 = avg((student.notes && student.notes[3]) || []);
          const all = [v1, v2, v3].filter((x) => x != null);
          const moyenne = all.length ? Number((all.reduce((a, b) => a + b, 0) / all.length).toFixed(2)) : null;

          rows.push({
            name,
            className: cls.name || 'Classe',
            t1: v1,
            t2: v2,
            t3: v3,
            moyenne,
            appreciation: assessment(moyenne),
            gradeClass: assessmentClass(moyenne)
          });
        });
      });

      return rows.sort((a, b) => (b.moyenne ?? -1) - (a.moyenne ?? -1));
    }

    function withRank(rows) {
      return rows.map((row, index) => ({ ...row, rank: index + 1 }));
    }

    function renderCards(rows) {
      const total = rows.length;
      const valid = rows.filter((r) => r.moyenne != null);
      const moyenneClasse = valid.length ? avg(valid.map((r) => r.moyenne)) : null;
      const best = valid[0] || null;
      const taux = total ? Math.round((valid.length / total) * 100) : 0;

      const cards = [
        { label: 'Élèves', value: total },
        { label: 'Moyenne classe', value: moyenneClasse == null ? '—' : moyenneClasse.toFixed(2).replace('.', ',') },
        { label: 'Meilleur profil', value: best ? best.name : '—' },
        { label: 'Moyennes complètes', value: `${valid.length}/${total}` }
      ];

      const container = document.getElementById('cards');
      container.innerHTML = cards.map((card) => `
        <div class="card">
          <div class="card-head">${card.label}</div>
          <div class="card-body">
            <span class="big-number">${card.value}</span>
            <div class="muted" style="margin-top:6px; font-size: 12px;">${card.label === 'Moyennes complètes' ? `${taux}% du groupe` : 'Vue synthèse'}</div>
          </div>
        </div>
      `).join('');
    }

    function renderTable(rows) {
      const table = document.getElementById('leaderboard');
      if (!rows.length) {
        table.innerHTML = '<div class="status">Aucune donnée disponible. Importez un CSV ou ouvrez la page avec une classe enregistrée.</div>';
        return;
      }

      const html = `
        <table>
          <thead>
            <tr>
              <th>Rang</th>
              <th>Élève</th>
              <th>Classe</th>
              <th>T1</th>
              <th>T2</th>
              <th>T3</th>
              <th>Moyenne</th>
              <th>Appréciation</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map((row) => `
              <tr>
                <td><span class="rank-badge">${row.rank}${row.rank === 1 ? 'er' : 'e'}</span></td>
                <td><strong>${row.name}</strong></td>
                <td>${row.className}</td>
                <td>${row.t1 == null ? '—' : row.t1.toFixed(2).replace('.', ',')}</td>
                <td>${row.t2 == null ? '—' : row.t2.toFixed(2).replace('.', ',')}</td>
                <td>${row.t3 == null ? '—' : row.t3.toFixed(2).replace('.', ',')}</td>
                <td><strong>${row.moyenne == null ? '—' : row.moyenne.toFixed(2).replace('.', ',')}</strong></td>
                <td><span class="grade-pill ${row.gradeClass}">${row.appreciation}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
      table.innerHTML = html;
    }

    function setStatus(message) {
      document.getElementById('statusBox').textContent = message;
    }

    function refresh() {
      const data = readLocalData();
      const rows = withRank(buildRows(data || { classes: [] }));
      renderCards(rows);
      renderTable(rows);

      if (!data) {
        document.getElementById('sourceInfo').textContent = 'Aucune donnée locale';
        setStatus('Aucune donnée chargée. Importez un CSV ou ouvrez la page après avoir enregistré des notes dans le navigateur.');
        return;
      }

      const firstClass = Array.isArray(data.classes) && data.classes[0] ? data.classes[0].name : 'Classe';
      document.getElementById('sourceInfo').textContent = `Source : ${firstClass}`;
      setStatus(`Données chargées : ${rows.length} élève(s) détecté(s).`);
    }

    function exportCsv() {
      const data = readLocalData();
      const rows = withRank(buildRows(data || { classes: [] }));
      if (!rows.length) {
        setStatus('Aucune donnée à exporter.');
        return;
      }

      const header = ['Rang', 'Élève', 'Classe', 'T1', 'T2', 'T3', 'Moyenne générale', 'Appréciation'];
      const csv = [header.join(',')].concat(rows.map((row) => [
        row.rank,
        '"' + String(row.name || '').replace(/"/g, '""') + '"',
        '"' + String(row.className || '').replace(/"/g, '""') + '"',
        row.t1 == null ? '' : row.t1.toFixed(2).replace('.', ','),
        row.t2 == null ? '' : row.t2.toFixed(2).replace('.', ','),
        row.t3 == null ? '' : row.t3.toFixed(2).replace('.', ','),
        row.moyenne == null ? '' : row.moyenne.toFixed(2).replace('.', ','),
        '"' + String(row.appreciation || '').replace(/"/g, '""') + '"'
      ].join(','))).join('\n');

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'gestinotes-synthese-' + new Date().toISOString().slice(0, 10) + '.csv';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(a.href);
      setStatus('CSV exporté avec succès.');
    }

    function importCsv(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const text = String(reader.result || '');
          const lines = text.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
          if (lines.length < 2) throw new Error('CSV vide');

          const rows = lines.slice(1).map((line) => {
            const cells = line.split(',').map((cell) => cell.trim().replace(/^"|"$/g, ''));
            return {
              name: cells[0] || '',
              t1: cells[1] || '',
              t2: cells[2] || '',
              t3: cells[3] || ''
            };
          }).filter((row) => row.name);

          if (!rows.length) throw new Error('Aucune donnée');

          const students = rows.map((row, index) => ({
            id: 'csv-' + Date.now() + '-' + index,
            name: row.name,
            notes: {
              1: [row.t1 || ''],
              2: [row.t2 || ''],
              3: [row.t3 || '']
            }
          }));

          const payload = {
            classes: [{
              id: 'csv-class-' + Date.now(),
              name: 'Classe importée',
              students,
              evals: { 1: [], 2: [], 3: [] },
              bmSessions: []
            }],
            currentClassId: 'csv-class-' + Date.now(),
            term: 1,
            view: 'saisie',
            cur: 0,
            dark: false,
            zoom: 1,
            sort: 'default',
            hideEmpty: false,
            wideNames: false,
            bmMode: 'bonus',
            bmScope: 'points'
          };

          localStorage.setItem('gestinotes_v4', JSON.stringify(payload));
          setStatus(`CSV importé : ${rows.length} élève(s) ajouté(s).`);
          refresh();
        } catch (error) {
          setStatus('Le fichier CSV est invalide. Utilisez le format : Nom,T1,T2,T3');
        }
      };
      reader.readAsText(file);
    }

    document.getElementById('reloadBtn').addEventListener('click', refresh);
    document.getElementById('exportCsvBtn').addEventListener('click', exportCsv);
    document.getElementById('printBtn').addEventListener('click', () => window.print());
    document.getElementById('importCsvInput').addEventListener('change', (event) => {
      const file = event.target.files && event.target.files[0];
      if (file) importCsv(file);
      event.target.value = '';
    });

    refresh();
  </script>
</body>
</html>
