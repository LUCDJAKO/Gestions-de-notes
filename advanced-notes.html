<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GestiNotes — Version utile</title>
  <style>
    :root {
      --green: #1b5e20;
      --green-2: #2e7d32;
      --gold: #c9a227;
      --bg: #edf7ee;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #5f6b63;
      --line: #dfeadf;
      --accent: #e8f5e9;
      --shadow: rgba(28, 76, 38, 0.12);
      --danger: #c62828;
      --warning: #f2a900;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #edf7ee 0%, #eef2ee 100%);
      color: var(--text);
    }

    .topbar {
      background: linear-gradient(135deg, var(--green), var(--green-2));
      color: white;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 5px solid var(--gold);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--gold);
      display: grid;
      place-items: center;
      color: var(--green);
      font-weight: 700;
      font-size: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.3rem, 2vw, 1.9rem);
      color: #ffeaa7;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .12s ease, opacity .12s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    .primary {
      background: var(--gold);
      color: #1d1d1d;
    }

    .secondary {
      background: rgba(255,255,255,.15);
      color: white;
      border: 1px solid rgba(255,255,255,.25);
    }

    .danger {
      background: var(--danger);
      color: white;
    }

    .wrap {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 16px 30px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin: 20px 0;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 4px 12px var(--shadow);
      overflow: hidden;
    }

    .card-head {
      padding: 12px 14px;
      background: var(--accent);
      border-bottom: 1px solid var(--line);
      font-weight: 700;
      color: var(--green);
    }

    .card-body {
      padding: 14px;
      font-size: 14px;
    }

    .big-number {
      font-size: 2rem;
      font-weight: 800;
      color: var(--green);
      display: block;
      margin-top: 8px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 4px 12px var(--shadow);
      padding: 16px;
      margin-top: 18px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 13px;
    }

    th {
      background: #f2fbf3;
      color: var(--green);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .good { color: var(--green); font-weight:700; }
    .warn { color: var(--warning); font-weight:700; }
    .bad { color: var(--danger); font-weight:700; }

    .status {
      padding: 10px 12px;
      border-radius: 8px;
      background: #f6faf7;
      border: 1px solid var(--line);
      color: var(--muted);
      margin-top: 12px;
      font-size: 13px;
    }

    .muted { color: var(--muted); }

    @media (max-width: 700px) {
      .topbar { align-items: flex-start; }
      table { display:block; overflow:auto; }
      .card-body { font-size: 13px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">N</div>
      <div>
        <h1>GestiNotes</h1>
        <div class="muted" style="color: rgba(255,255,255,.8); font-size: 12px;">Version utile — synthèse + CSV</div>
      </div>
    </div>

    <div class="toolbar">
      <button class="secondary" id="loadCurrentBtn">Recharger les données</button>
      <button class="primary" id="exportCsvBtn">Exporter CSV</button>
      <label class="secondary" style="display:inline-block; cursor:pointer;">
        <input id="importCsvInput" type="file" accept=".csv,text/csv" style="display:none;" />
        Importer CSV
      </label>
    </div>
  </header>

  <main class="wrap">
    <section class="cards" id="summaryCards"></section>

    <section class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <h2 style="margin:0; color:var(--green);">Synthèse par élève</h2>
        <div class="muted" id="sourceName">Aucune donnée chargée</div>
      </div>
      <div id="tableWrap" style="overflow:auto; margin-top:12px;">
        <table>
          <thead>
            <tr>
              <th>Élève</th>
              <th>T1</th>
              <th>T2</th>
              <th>T3</th>
              <th>Moy. générale</th>
              <th>Appréciation</th>
            </tr>
          </thead>
          <tbody id="summaryBody"></tbody>
        </table>
      </div>
      <div class="status" id="statusBox">Aucune donnée encore importée. Les données de la version actuelle stockées dans le navigateur seront utilisées si elles existent.</div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = 'gestinotes_v4';
    const LEGACY_KEY = 'gestinotes_v3';

    const avg = (values) => {
      const data = values.filter((n) => n !== null && n !== undefined && n !== '').map(Number).filter((n) => !Number.isNaN(n));
      if (!data.length) return null;
      return Number((data.reduce((a, b) => a + b, 0) / data.length).toFixed(2));
    };

    const assessment = (value) => {
      if (value == null) return '—';
      if (value >= 17) return 'Très bien';
      if (value >= 14) return 'Bien';
      if (value >= 12) return 'Assez bien';
      if (value >= 10) return 'Passable';
      if (value >= 8) return 'Insuffisant';
      if (value >= 5) return 'Très insuffisant';
      return 'Faible';
    };

    const clamp = (n) => Math.max(0, Math.min(20, Number(n) || 0));

    function readData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.classes) && parsed.classes.length) return parsed;
      } catch (e) {
        console.warn('Impossible de lire les données locales.', e);
      }
      return null;
    }

    function extractStudents(data) {
      const classes = Array.isArray(data && data.classes) ? data.classes : [];
      if (!classes.length) return [];

      const all = [];
      classes.forEach((cls) => {
        const students = Array.isArray(cls.students) ? cls.students : [];
        students.forEach((student) => {
          const cleanName = (student && student.name ? student.name.trim() : '').replace(/\s+/g, ' ');
          if (!cleanName) return;
          all.push({ className: cls.name || 'Classe', student });
        });
      });

      return all;
    }

    function buildSummaryRows() {
      const data = readData();
      const rows = [];
      const students = extractStudents(data);

      students.forEach(({ className, student }) => {
        const termValues = [1, 2, 3].map((term) => {
          const notes = Array.isArray(student.notes && student.notes[term]) ? student.notes[term] : [];
          const clean = notes.map((n) => Number(String(n).replace(',', '.'))).filter((n) => !Number.isNaN(n));
          return clean.length ? avg(clean) : null;
        });

        const overall = avg(termValues.filter((v) => v != null));
        rows.push({
          name: student.name,
          className,
          t1: termValues[0],
          t2: termValues[1],
          t3: termValues[2],
          average: overall,
          assessment: assessment(overall)
        });
      });

      rows.sort((a, b) => {
        if ((b.average ?? -1) === (a.average ?? -1)) return a.name.localeCompare(b.name, 'fr');
        return (b.average ?? -1) - (a.average ?? -1);
      });

      return rows;
    }

    function renderCards(rows) {
      const totalStudents = rows.length;
      const totalFilled = rows.filter((r) => r.average != null).length;
      const classAverage = avg(rows.map((r) => r.average).filter((v) => v != null));
      const best = rows.filter((r) => r.average != null).sort((a, b) => (b.average ?? 0) - (a.average ?? 0))[0];

      const cards = [
        { label: 'Élèves', value: totalStudents },
        { label: 'Moyenne classe', value: classAverage == null ? '—' : `${classAverage.toFixed(2).replace('.', ',')}` },
        { label: 'Moyennes complètes', value: `${totalFilled}/${totalStudents}` },
        { label: 'Meilleur profil', value: best ? best.name : '—' }
      ];

      const container = document.getElementById('summaryCards');
      container.innerHTML = cards.map((card) => `
        <div class="card">
          <div class="card-head">${card.label}</div>
          <div class="card-body">
            <span class="big-number">${card.value}</span>
          </div>
        </div>
      `).join('');
    }

    function renderTable(rows) {
      const tbody = document.getElementById('summaryBody');
      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="muted">Aucune donnée disponible.</td></tr>';
        return;
      }

      tbody.innerHTML = rows.map((row) => {
        const t1 = row.t1 == null ? '—' : row.t1.toFixed(2).replace('.', ',');
        const t2 = row.t2 == null ? '—' : row.t2.toFixed(2).replace('.', ',');
        const t3 = row.t3 == null ? '—' : row.t3.toFixed(2).replace('.', ',');
        const average = row.average == null ? '—' : row.average.toFixed(2).replace('.', ',');
        return `
          <tr>
            <td>${row.name}</td>
            <td>${t1}</td>
            <td>${t2}</td>
            <td>${t3}</td>
            <td>${average}</td>
            <td>${row.assessment}</td>
          </tr>
        `;
      }).join('');
    }

    function updateStatus(message) {
      document.getElementById('statusBox').textContent = message;
    }

    function refresh() {
      const data = readData();
      const rows = buildSummaryRows();
      renderCards(rows);
      renderTable(rows);

      if (!data) {
        document.getElementById('sourceName').textContent = 'Aucune donnée locale';
        updateStatus('Aucune donnée encore importée. Les données de la version actuelle stockées dans le navigateur seront utilisées si elles existent.');
        return;
      }

      const firstClass = Array.isArray(data.classes) && data.classes[0] ? data.classes[0].name : 'Classe';
      document.getElementById('sourceName').textContent = `Source : ${firstClass}`;
      updateStatus(`Données chargées depuis le navigateur (${rows.length} élève(s) détecté(s)).`);
    }

    function exportCsv() {
      const rows = buildSummaryRows();
      if (!rows.length) {
        updateStatus('Aucune donnée à exporter.');
        return;
      }

      const header = ['Nom', 'T1', 'T2', 'T3', 'Moyenne generale', 'Appreciation'];
      const csv = [header.join(',')].concat(rows.map((r) => [
        '"' + (r.name || '').replace(/"/g, '""') + '"',
        r.t1 == null ? '' : r.t1.toFixed(2).replace('.', ','),
        r.t2 == null ? '' : r.t2.toFixed(2).replace('.', ','),
        r.t3 == null ? '' : r.t3.toFixed(2).replace('.', ','),
        r.average == null ? '' : r.average.toFixed(2).replace('.', ','),
        '"' + (r.assessment || '').replace(/"/g, '""') + '"'
      ].join(','))).join('\n');

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'gestion-notes-synthese.csv';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      updateStatus('CSV exporté avec succès.');
    }

    function importCsv(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const text = String(reader.result || '');
          const lines = text.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
          if (!lines.length) {
            updateStatus('Le fichier CSV est vide.');
            return;
          }

          const rows = lines.slice(1).map((line) => {
            const cells = line.split(',').map((cell) => cell.trim());
            return {
              name: cells[0] || '',
              t1: cells[1] || '',
              t2: cells[2] || '',
              t3: cells[3] || ''
            };
          }).filter((row) => row.name);

          if (!rows.length) {
            updateStatus('Aucune ligne exploitable dans le CSV.');
            return;
          }

          const className = 'Import CSV';
          const studentList = rows.map((row, index) => ({
            id: `csv-${Date.now()}-${index}`,
            name: row.name,
            notes: {
              1: [row.t1 || ''],
              2: [row.t2 || ''],
              3: [row.t3 || '']
            }
          }));

          const nextData = {
            classes: [{
              id: `csv-class-${Date.now()}`,
              name: className,
              students: studentList,
              evals: { 1: [{ type: 'IE', scale: 20, coef: 1, label: '', date: '' }], 2: [{ type: 'IE', scale: 20, coef: 1, label: '', date: '' }], 3: [{ type: 'IE', scale: 20, coef: 1, label: '', date: '' }] },
              bmSessions: []
            }],
            currentClassId: `csv-class-${Date.now()}`,
            view: 'saisie',
            term: 1,
            cur: 0,
            dark: false,
            zoom: 1,
            sort: 'default',
            hideEmpty: false,
            wideNames: false,
            bmMode: 'bonus',
            bmScope: 'points'
          };

          localStorage.setItem(STORAGE_KEY, JSON.stringify(nextData));
          updateStatus(`CSV importé : ${rows.length} élève(s) ajoutés.`);
          refresh();
        } catch (error) {
          console.error(error);
          updateStatus('Le fichier CSV est invalide. Utilise Nom,T1,T2,T3.');
        }
      };
      reader.readAsText(file);
    }

    document.getElementById('exportCsvBtn').addEventListener('click', exportCsv);
    document.getElementById('loadCurrentBtn').addEventListener('click', refresh);
    document.getElementById('importCsvInput').addEventListener('change', (event) => {
      const file = event.target.files && event.target.files[0];
      if (file) importCsv(file);
      event.target.value = '';
    });

    refresh();
  </script>
</body>
</html>
