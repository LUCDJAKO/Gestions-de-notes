<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GestiNotes — Gestion des notes</title>
<meta name="description" content="Application de gestion des notes, moyennes, bonus/malus et livrets scolaires.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📘</text></svg>">
<style>
:root{--vert:#0a6b3a;--vert2:#0b8a4f;--or:#f77f00;--or2:#ffc27a;
--bg:#fffaf4;--card:#fff;--text:#1a1a1a;--muted:#555;--accent:#0a6b3a;--border:#ffd9b0;--line:#f0e6da;--line2:#e5d5c3;--thead:#e6f5ec;--tfoot:#fff1e0;--cell:#fff1e0;--yel:#fff1e0;--yel2:#ffe4c7;--zebra:#fff8f0;--input:#fff;--inputb:#a5d6a7;--ph:#9e9e9e;--panel:#fff8e1;--stat:#fff8e1;--statz:#fff3c4;--statb:#ffc27a;--ok:#dcedc8;--okt:#1b5e20;--ko:#ffcdd2;--kot:#b71c1c}
body.dark{--bg:#0b160d;--card:#152a18;--text:#f4f1ec;--muted:#b9c4b9;--accent:#ffa94d;--border:#2f5433;--line:#26402a;--line2:#3a5a3e;--thead:#1d3a21;--tfoot:#3d2a12;--cell:#2e2010;--yel:#2e2010;--zebra:#1b321e;--input:#0f2012;--inputb:#3f7a45;--ph:#6c7d6c}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{margin:0;font-family:system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;transition:background .3s,color .3s}
header{position:sticky;top:0;z-index:40;background:linear-gradient(135deg,var(--vert),var(--vert2));color:#fff;padding:10px 14px;display:flex;align-items:center;gap:12px;border-bottom:4px solid var(--or)}
header h1{margin:0;font-size:21px;color:var(--or2);letter-spacing:.5px}
header small{display:block;font-size:11px;opacity:.9}
.toggle{background:transparent;border:2px solid var(--or2);color:var(--or2);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
.wrap{padding:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{border:none;border-radius:8px;padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer;background:var(--vert2);color:#fff;transition:opacity .15s}
.btn:hover{opacity:.9}
.btn.or{background:var(--or);color:#1a1a1a}
.btn.red{background:#c62828;color:#fff}
.btn.grey{background:#78909c;color:#fff}
.btn.light{background:var(--card);color:var(--accent);border:2px solid var(--vert2)}
.btn.active{outline:3px solid var(--or2)}
.btn.big{font-size:15px;padding:11px 14px}
.btn.sm{font-size:12px;padding:5px 8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
select,input[type=text],input[type=date],textarea{padding:8px;border:1px solid var(--inputb);border-radius:6px;font-size:15px;background:var(--input);color:var(--text)}
label.lbl{display:block;font-weight:700;color:var(--accent);margin:8px 0 3px;font-size:13px}
/* Onglets de trimestre — très visibles pour éviter toute confusion */
.term-tabs-row{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;margin-bottom:0}
.tab{padding:12px 18px;border-radius:10px 10px 0 0;font-weight:700;color:#fff;border:3px solid transparent;opacity:.5;filter:grayscale(.35) brightness(.92);cursor:pointer;font-size:14px;transform:scale(.96);transition:all .18s ease}
.tab:hover{opacity:.85;filter:grayscale(.1)}
.tab.on{opacity:1;filter:none;transform:scale(1.08);border-color:#fff;box-shadow:0 -3px 0 var(--or) inset,0 0 0 3px var(--or2),0 8px 16px rgba(0,0,0,.3);font-size:15px}
.view{flex:1;padding:11px 2px;border-radius:8px;font-weight:700;font-size:12px;background:var(--card);color:var(--accent);border:2px solid var(--vert2);cursor:pointer;min-width:60px}
.view.on{background:var(--vert);color:var(--or2)}
.term-badge{display:inline-flex;align-items:center;gap:7px;background:rgba(0,0,0,.18);border:2px solid var(--or2);color:#fff;padding:6px 14px;border-radius:20px;font-weight:800;font-size:12.5px}
.term-badge .dot{width:11px;height:11px;border-radius:50%;display:inline-block}
.active-term-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-radius:10px;padding:10px 14px;margin-bottom:10px;font-weight:800;color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.active-term-banner .big{font-size:16px}
.active-term-banner .warn{font-size:11.5px;font-weight:700;opacity:.95;background:rgba(0,0,0,.2);padding:4px 10px;border-radius:12px}
.tbl-wrap{overflow:auto;max-height:66vh;border:1px solid var(--border);border-radius:8px;background:var(--card)}
.tbl-wrap.tall{max-height:88vh}
table{border-collapse:separate;border-spacing:0;min-width:max-content;width:100%}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:3px 4px;text-align:center;white-space:nowrap;font-size:13px;color:var(--text)}
thead th{position:sticky;top:0;z-index:4;background:var(--thead);vertical-align:top}
tfoot td{position:sticky;bottom:0;z-index:4;background:var(--tfoot);font-weight:700}
.st-num{position:sticky;left:0;z-index:2;background:var(--cell);min-width:40px;width:40px;font-weight:700;font-size:14px}
.st-name{position:sticky;left:40px;z-index:2;background:var(--cell);text-align:left;padding:6px 8px;min-width:180px;max-width:180px;font-size:14px;font-weight:600}
.st-chk{position:sticky;left:220px;z-index:2;background:var(--cell);width:42px;min-width:42px}
tbody tr:nth-child(even) td{background:var(--zebra)}
input.name{width:100%;min-width:240px;padding:9px 6px;border:1px solid var(--line2);border-radius:4px;font-size:15px;background:var(--yel);color:var(--text)}
input[type=checkbox].pick{width:22px;height:22px;accent-color:#0b8a4f}
input.big{width:90px;padding:12px 6px;border:2px solid var(--inputb);border-radius:6px;text-align:center;font-size:20px;font-weight:700;background:var(--yel);color:var(--text)}
input.big:focus{outline:3px solid var(--or);transform:scale(1.05)}
.g{background:var(--ok)!important;color:var(--okt)!important;font-weight:700}
.r{background:var(--ko)!important;color:var(--kot)!important;font-weight:700}
.ph{color:var(--ph)}
.moy-big{font-size:18px;padding:8px 10px;min-width:90px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--vert);color:var(--or2);padding:10px 18px;border-radius:20px;font-weight:700}
@media(max-width:768px){.st-name{min-width:160px;max-width:160px;font-size:12px}}
@media print{.noprint{display:none!important}.tbl-wrap{max-height:none;overflow:visible}}
</style>
</head>
<body>
<div id="root"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fffaf4;color:#0a6b3a;font-family:system-ui,sans-serif;font-weight:700">Chargement de GestiNotes…</div></div>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
const { useState,useEffect,useMemo,useCallback,useRef }=React;const NB_ELEVES=100,NB_NOTES=20,STORAGE_KEY="gestinotes_v4",OLD_STORAGE_KEY="gestinotes_v3";const TYPES={IE:{label:"Interrogation écrite",short:"IE",color:"#bbdefb"},IO:{label:"Interrogation orale",short:"IO",color:"#f8bbd0"},DC:{label:"Devoir de classe",short:"DC",color:"#ffe0b2"},DN:{label:"Devoir de niveau",short:"DN",color:"#e1bee7"}};const TERMS={1:{label:"1er Trimestre",short:"T1",coef:1,color:"#1e88e5",icon:"1️⃣"},2:{label:"2e Trimestre",short:"T2",coef:2,color:"#8e24aa",icon:"2️⃣"},3:{label:"3e Trimestre",short:"T3",coef:2,color:"#f4511e",icon:"3️⃣"}};const APPR=[{min:17,label:"Très bien",bg:"#1b5e20",fg:"#fff"},{min:14,label:"Bien",bg:"#43a047",fg:"#fff"},{min:12,label:"Assez bien",bg:"#9ccc65",fg:"#1a1a1a"},{min:10,label:"Passable",bg:"#ffd54f",fg:"#1a1a1a"},{min:8,label:"Insuffisant",bg:"#ffa726",fg:"#1a1a1a"},{min:5,label:"Très insuffisant",bg:"#ef5350",fg:"#fff"},{min:0,label:"Faible",bg:"#b71c1c",fg:"#fff"}];const appr=m=>m==null?null:APPR.find(a=>m>=a.min)||null;const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);const todayStr=()=>new Date().toISOString().slice(0,10);const newEval=()=>({type:"IE",scale:20,coef:1,label:"",date:""});const newEvals=()=>Array.from({length:NB_NOTES},newEval);const emptyNotes=()=>({1:Array(NB_NOTES).fill(""),2:Array(NB_NOTES).fill(""),3:Array(NB_NOTES).fill("")});const newStudent=(i,name="")==>({id:uid()+i,name,notes:emptyNotes()});function newClass(name,names=[]){return{id:uid(),name,students:Array.from({length:NB_ELEVES},(_,i)=>newStudent(i,names[i]||"")),evals:{1:newEvals(),2:newEvals(),3:newEvals()},bmSessions:[]}}const parseNum=v=>{if(v===""||v==null)return null;const n=parseFloat(String(v).replace(",","."));return isNaN(n)?null:n};const fmt=n=>n==null?"-":n.toFixed(2).replace(".",",");const fmtDate=d=>{if(!d)return"";const p=d.split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0].slice(2):d};const mean=arr=>{const v=arr.filter(x=>x! ll:"#fff8e1"}),React.createElement("path",{d:"M52 25 V38",stroke:"#ffd54f",strokeWidth:2.5}),React.createElement("circle",{cx:52,cy:40,r:2.5,fill:"#ffd54f"}));
