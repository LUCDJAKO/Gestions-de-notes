<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GestiNotes — Gestion des notes</title>
<meta name="description" content="Application de gestion des notes, moyennes, bonus/malus et livrets scolaires." />
<style>
:root{--vert:#1b5e20;--vert2:#2e7d32;--or:#c9a227;--or2:#ffd54f;
--bg:#e8f5e9;--card:#fff;--text:#1a1a1a;--muted:#555;--accent:#1b5e20;--border:#c8e6c9;--line:#e0e0e0;--line2:#cfd8dc;--thead:#e8f5e9;--tfoot:#fff8e1;--cell:#fff;--zebra:#f3faf3;--input:#fff;--inputb:#c7d5c8;--ok:#d9f7be;--okt:#2e7d32;--ko:#ffebee;--kot:#c62828;--bonus:#e8f5e9;--malus:#fff1f1;--panel:#f5fbf5;--stat:#f8fbf8;--statb:#dfeee0;--ph:#6a6a6a;--shadow:rgba(0,0,0,.14)}
body.dark{--bg:#0b160d;--card:#152a18;--text:#eef3ee;--muted:#aebdae;--accent:#ffd54f;--border:#2f5433;--line:#26402a;--line2:#3a5a3e;--thead:#1d3a21;--tfoot:#3b3214;--cell:#152a18;--zebra:#1b321e;--input:#1b2e1d;--inputb:#456148;--ok:#1d3b1d;--okt:#b9f6ca;--ko:#442225;--kot:#ff8a80;--bonus:#1d3a21;--malus:#3b1420;--panel:#152c1a;--stat:#1e3524;--statb:#325033;--ph:#b9c9b7;--shadow:rgba(0,0,0,.35)}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;transition:background .3s,color .3s}
header{background:linear-gradient(135deg,var(--vert),var(--vert2));color:#fff;padding:10px 14px;display:flex;align-items:center;gap:12px;border-bottom:4px solid var(--or);flex-wrap:wrap}
header h1{margin:0;font-size:21px;color:var(--or2);letter-spacing:.5px}
header small{display:block;font-size:11px;opacity:.9}
.toggle{background:transparent;border:2px solid var(--or2);color:var(--or2);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
.wrap{padding:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{border:none;border-radius:8px;padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer;background:var(--vert2);color:#fff;transition:opacity .15s}
.btn:hover{opacity:.9}
.btn.or{background:var(--or);color:#1a1a1a}
.btn.red{background:#c62828;color:#fff}
.btn.grey{background:#78909c;color:#fff}
.btn.light{background:var(--card);color:var(--accent);border:2px solid var(--vert2)}
.btn.active{outline:3px solid var(--or2)}
.btn.big{font-size:15px;padding:11px 14px}
.btn.sm{font-size:12px;padding:5px 8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
select,input[type=text],input[type=date],textarea{padding:8px;border:1px solid var(--inputb);border-radius:6px;font-size:15px;background:var(--input);color:var(--text)}
label.lbl{display:block;font-weight:700;color:var(--accent);margin:8px 0 3px;font-size:13px}
.tab{padding:9px 12px;border-radius:8px 8px 0 0;font-weight:700;color:#fff;border:none;opacity:.55;cursor:pointer}
.tab.on{opacity:1;box-shadow:0 -3px 0 var(--or) inset}
.view{flex:1;padding:11px 2px;border-radius:8px;font-weight:700;font-size:12px;background:var(--card);color:var(--accent);border:2px solid var(--vert2);cursor:pointer;min-width:60px}
.view.on{background:var(--vert);color:var(--or2)}
.tbl-wrap{overflow:auto;max-height:66vh;border:1px solid var(--border);border-radius:8px;background:var(--card)}
.tbl-wrap.tall{max-height:88vh}
table{border-collapse:separate;border-spacing:0;min-width:max-content;width:100%}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:3px 4px;text-align:center;white-space:nowrap;font-size:13px;color:var(--text)}
thead th{position:sticky;top:0;z-index:4;background:var(--thead);vertical-align:top}
tfoot td{position:sticky;bottom:0;z-index:4;background:var(--tfoot);font-weight:700}
.st-num{position:sticky;left:0;z-index:2;background:var(--cell);min-width:40px;width:40px;font-weight:700;font-size:14px;vertical-align:top;padding-top:10px}
.st-name{position:sticky;left:40px;z-index:2;background:var(--cell);text-align:left;padding:6px 8px;min-width:180px;max-width:180px;font-size:14px;font-weight:600;white-space:normal;word-wrap:break-word}
.st-chk{position:sticky;left:220px;z-index:2;background:var(--cell);width:42px;min-width:42px;vertical-align:top;padding-top:12px;text-align:center}
thead .st-num,thead .st-name,thead .st-chk{background:var(--thead);z-index:6}
tfoot .st-num,tfoot .st-name,tfoot .st-chk{background:var(--tfoot);z-index:6}
tbody tr:nth-child(even) td{background:var(--zebra)}
tbody tr.picked td{background:#fff3cd!important}
body.dark tbody tr.picked td{background:#3d3516!important}
input.name{width:100%;min-width:240px;padding:9px 6px;border:1px solid var(--line2);border-radius:4px;font-size:15px;background:var(--input);color:var(--text)}
input[type=checkbox].pick{width:22px;height:22px;accent-color:#2e7d32;cursor:pointer}
input.big{width:90px;padding:12px 6px;border:2px solid var(--inputb);border-radius:6px;text-align:center;font-size:20px;font-weight:700;background:var(--input);color:var(--text);box-shadow:0 2px 4px rgba(0,0,0,.08)}
input.big:focus{outline:3px solid var(--or);transform:scale(1.05);box-shadow:0 4px 8px rgba(0,0,0,.15)}
input.big.malus-input{border-color:#e53935;color:#c62828}
input.big.bonus-input{border-color:#43a047;color:#1b5e20}
body.dark input.big.malus-input{color:#ff8a80}
body.dark input.big.bonus-input{color:#b9f6ca}
tbody tr{min-height:52px;height:auto}
tbody td{padding:8px 4px;vertical-align:top}
.g{background:var(--ok)!important;color:var(--okt)!important;font-weight:700}
.r{background:var(--ko)!important;color:var(--kot)!important;font-weight:700}
.tok{color:var(--okt)!important}.tko{color:var(--kot)!important}
.bonuscell{background:var(--bonus)!important;font-weight:700}
.bonuscell.negative{background:var(--malus)!important;color:#c62828!important}
body.dark .bonuscell.negative{color:#ff8a80!important}
.hgold{background:var(--or2)!important;color:#1a1a1a!important}
.ph{color:var(--ph)}
.moy-big{font-size:18px;padding:8px 10px;min-width:90px}
.vue td,.vue th{border-right:1px solid var(--line2)}
.vue .st-name{font-size:calc(13px*var(--z));font-weight:600;padding:6px;max-width:calc(130px*var(--z));min-width:calc(110px*var(--z));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vue.wide-names .st-name{max-width:calc(220px*var(--z));min-width:calc(200px*var(--z))}
.vue td.nt{font-size:calc(16px*var(--z));font-weight:700;min-width:calc(46px*var(--z));padding:calc(7px*var(--z)) 4px}
.vue td.mo{font-size:calc(17px*var(--z));min-width:76px}
.vue tr.sel td{box-shadow:inset 0 3px 0 var(--or),inset 0 -3px 0 var(--or)}
.vue tr.sel .st-name{color:var(--accent)}
.colhead{display:flex;flex-direction:column;gap:1px;align-items:center;padding:4px 2px;border-radius:6px;cursor:pointer;min-width:46px;color:#1a1a1a}
.colhead b{font-size:14px}
.colhead small{font-size:10px;font-weight:400}
.chip{display:inline-block;padding:2px 7px;border-radius:12px;font-size:11px;font-weight:600;margin:2px}
.appr{display:inline-block;padding:3px 8px;border-radius:12px;font-size:12px;font-weight:700;white-space:nowrap}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--vert);color:var(--or2);padding:10px 18px;border-radius:20px;font-weight:700;z-index:99;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stat{background:var(--stat);border:1px solid var(--statb);border-radius:8px;padding:6px 10px;font-size:12px}
.stat b{display:block;font-size:16px;color:var(--accent)}
.menu{position:absolute;background:var(--card);border:2px solid var(--vert2);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:4px;z-index:50;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.rel{position:relative}
.panel{border:2px solid var(--or);background:var(--panel);border-radius:10px;padding:8px;margin-bottom:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:12px}
.modal .box{background:var(--card);border-radius:12px;padding:14px;width:100%;max-width:760px;max-height:92vh;overflow:auto;border-top:6px solid var(--or)}
.hint{font-size:12px;color:var(--muted);margin:4px 0}
.coefbtn{background:var(--vert);color:var(--or2);font-size:16px;padding:12px 16px;border-radius:10px;border:3px solid var(--or)}
h3{color:var(--accent)}
.bm-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:12px;font-size:12px;font-weight:700}
.bm-badge.pos{background:#c8e6c9;color:#1b5e20}
.bm-badge.neg{background:#ffcdd2;color:#b71c1c}
body.dark .bm-badge.pos{background:#1f5e28;color:#c8f5cf}
body.dark .bm-badge.neg{background:#6e1f1f;color:#ffd0d0}
.bm-toggle{display:flex;border-radius:8px;overflow:hidden;border:2px solid var(--vert2)}
.bm-toggle button{flex:1;padding:8px 14px;border:none;font-size:13px;font-weight:700;cursor:pointer;transition:background .2s,color .2s}
.bm-toggle button.bm-bonus{background:#e8f5e9;color:#1b5e20}
.bm-toggle button.bm-malus{background:#fff5f5;color:#c62828}
.bm-toggle button.bm-bonus.on{background:#2e7d32;color:#ffd54f}
.bm-toggle button.bm-malus.on{background:#c62828;color:#fff}
.bm-toggle button.bm-scope{background:#e3f2fd;color:#0d47a1}
.bm-toggle button.bm-scope.on{background:#1565c0;color:#fff}
body.dark .bm-toggle button.bm-bonus{background:#1d3a21;color:#c8f5cf}
body.dark .bm-toggle button.bm-malus{background:#3b1420;color:#ff8a80}
body.dark .bm-toggle button.bm-bonus.on{background:#2e7d32;color:#ffd54f}
body.dark .bm-toggle button.bm-malus.on{background:#c62828;color:#fff}
body.dark .bm-toggle button.bm-scope{background:#13293d;color:#90caf9}
.bulk-bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;border:2px dashed var(--vert2);background:var(--panel);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.bulk-bar.malus-bulk{border-color:#e53935;background:var(--malus)}
.bulk-bar input.bulkval{width:90px;padding:9px;border:2px solid var(--inputb);border-radius:8px;text-align:center;font-size:18px;font-weight:700;background:var(--input);color:var(--text)}
.bulk-count{font-weight:700;color:var(--accent)}
.bm-date-bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;background:var(--panel);border:2px solid var(--or);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.bm-date-bar.malus-bar{border-color:#e53935;background:var(--malus)}
.bm-session-label{font-size:13px;font-weight:700;color:var(--accent)}
.bm-date-input{padding:7px 10px;border:2px solid var(--inputb);border-radius:8px;font-size:14px;font-weight:600;background:var(--input);color:var(--text);cursor:pointer}
.bm-date-input.malus-date{border-color:#e53935}
.bm-save-btn{background:#2e7d32;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px}
.bm-save-btn.malus-save{background:#c62828}
.bm-save-btn:disabled{opacity:.45;cursor:not-allowed}
.bm-reason-input{padding:7px 10px;border:1.5px solid var(--inputb);border-radius:8px;font-size:13px;background:var(--input);color:var(--text);flex:1;min-width:140px}
.hist-panel{margin-top:10px}
.hist-toggle-btn{display:flex;align-items:center;gap:6px;background:none;border:2px solid var(--border);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--accent);cursor:pointer;flex-wrap:wrap}
.hist-group{border:1.5px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden}
.hist-group-header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--thead);border-bottom:1.5px solid var(--border);flex-wrap:wrap}
.hist-group-header.bonus-header{border-left:5px solid #43a047}
.hist-group-header.malus-header{border-left:5px solid #e53935}
.hist-date{font-weight:700;font-size:14px;color:var(--accent)}
.hist-reason{font-size:12px;color:var(--muted);font-style:italic;flex:1}
.hist-del-btn{background:#c62828;color:#fff;border:none;border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer}
.hist-edit-btn{background:#1565c0;color:#fff;border:none;border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer;margin-left:auto}
.hist-entries-table{width:100%;border-collapse:collapse}
.hist-entries-table th{background:var(--thead);padding:5px 8px;font-size:12px;font-weight:700;text-align:left;border-bottom:1px solid var(--line)}
.hist-entries-table td{padding:5px 8px;font-size:13px;border-bottom:1px solid var(--line)}
.hist-entries-table tr:nth-child(even) td{background:var(--zebra)}
.hist-val-pos{color:#1b5e20;font-weight:700}
.hist-val-neg{color:#c62828;font-weight:700}
body.dark .hist-val-pos{color:#b9f6ca}
body.dark .hist-val-neg{color:#ff8a80}
.hist-empty{text-align:center;color:var(--muted);padding:16px;font-size:13px}
.hist-total-row td{font-weight:700;background:var(--tfoot)!important;border-top:2px solid var(--line2)}
.session-count-badge{display:inline-flex;align-items:center;justify-content:center;background:var(--vert2);color:#fff;border-radius:12px;font-size:11px;font-weight:700;padding:2px 7px;min-width:24px}
.session-count-badge.malus-badge{background:#c62828}
.bm-cumul{display:flex;flex-direction:column;gap:2px;min-width:56px;text-align:center}
.bm-cumul .bm-badge{margin:1px 0;justify-content:center}
.student-bm-entry{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 5px;border-radius:8px;white-space:nowrap;margin:1px 0}
.student-bm-entry.pos{background:#e8f5e9;color:#1b5e20}
.student-bm-entry.neg{background:#fff0f0;color:#c62828}
body.dark .student-bm-entry.pos{background:#1d3a21;color:#b9f6ca}
body.dark .student-bm-entry.neg{background:#3b1420;color:#ff8a80}
.scope-pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;background:#e3f2fd;color:#0d47a1}
body.dark .scope-pill{background:#13293d;color:#90caf9}
.edit-grid{display:grid;grid-template-columns:36px 1fr 110px;gap:4px 8px;align-items:center;max-height:46vh;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:8px}
.edit-grid input{width:100%;padding:7px;border:2px solid var(--inputb);border-radius:6px;text-align:center;font-weight:700;background:var(--input);color:var(--text)}
.edit-grid .en{text-align:left;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.confirm-box{background:var(--card);border-radius:12px;padding:20px;max-width:430px;width:100%;border-top:5px solid #c62828;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.confirm-box h4{margin:0 0 10px;color:#c62828;font-size:16px}
.confirm-box p{margin:0 0 16px;font-size:14px;color:var(--text)}
.confirm-actions{display:flex;gap:8px;justify-content:flex-end}
@media(max-width:768px){
  .st-name{min-width:160px;max-width:160px;font-size:12px}
  .st-chk{left:200px}
  input.big{width:80px;font-size:18px;padding:10px 4px}
  tbody tr{min-height:48px}
}
@media print{.noprint{display:none!important}.tbl-wrap{max-height:none;overflow:visible}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div id="root"></div>
<div id="summary-launcher" style="position:fixed; right:16px; bottom:18px; z-index:1200; display:flex; gap:8px; align-items:center;">
  <button id="summary-open-btn" type="button" style="background:linear-gradient(135deg,#1b5e20,#2e7d32); color:white; border:none; border-radius:999px; padding:12px 18px; font-size:13px; font-weight:700; cursor:pointer; box-shadow:0 8px 18px rgba(27,94,32,.25);">📊 Synthèse + CSV</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
(() => {
  const btn = document.getElementById('summary-open-btn');
  if (btn) {
    btn.addEventListener('click', () => {
      window.open('advanced-notes.html', '_blank');
    });
  }
})();
</script>
<script>
(() => {
  const { useState, useEffect, useMemo, useCallback, useRef, memo } = React;

  const NB_ELEVES = 100;
  const NB_NOTES = 20;
  const STORAGE_KEY = 'gestinotes_v4';
  const OLD_STORAGE_KEY = 'gestinotes_v3';

  const TYPES = { IE:{label:'Interrogation écrite',short:'IE',color:'#bbdefb'}, IO:{label:'Interrogation orale',short:'IO',color:'#f8bbd0'}, DC:{label:'Devoir de classe',short:'DC',color:'#ffe0b2'}, DN:{label:'Devoir de niveau',short:'DN',color:'#e1bee7'} };
  const TERMS = { 1:{label:'1er Trimestre',short:'T1',coef:1,color:'#1e88e5'}, 2:{label:'2e Trimestre',short:'T2',coef:2,color:'#8e24aa'}, 3:{label:'3e Trimestre',short:'T3',coef:2,color:'#f4511e'} };
  const APPR = [
    { min:17, label:'Très bien', bg:'#1b5e20', fg:'#fff' },
    { min:14, label:'Bien', bg:'#43a047', fg:'#fff' },
    { min:12, label:'Assez bien', bg:'#9ccc65', fg:'#1a1a1a' },
    { min:10, label:'Passable', bg:'#ffd54f', fg:'#1a1a1a' },
    { min:8, label:'Insuffisant', bg:'#ffa726', fg:'#1a1a1a' },
    { min:5, label:'Très insuffisant', bg:'#ef5350', fg:'#fff' },
    { min:0, label:'Faible', bg:'#b71c1c', fg:'#fff' }
  ];

  const appr = (m) => (m == null ? null : APPR.find((a) => m >= a.min) || null);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const todayStr = () => new Date().toISOString().slice(0, 10);
  const newEval = () => ({ type:'IE', scale:20, coef:1, label:'', date:'' });
  const newEvals = () => Array.from({ length:NB_NOTES }, newEval);
  const emptyNotes = () => ({ 1:Array(NB_NOTES).fill(''), 2:Array(NB_NOTES).fill(''), 3:Array(NB_NOTES).fill('') });
  const newStudent = (i, name='') => ({ id:uid()+i, name, notes:emptyNotes() });
  const newClass = (name, names=[]) => ({ id:uid(), name, students:Array.from({ length:NB_ELEVES }, (_, i) => newStudent(i, names[i] || '')), evals:{1:newEvals(),2:newEvals(),3:newEvals()}, bmSessions:[] });
  const parseNum = (v) => { if(v === '' || v == null) return null; const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
  const fmt = (n) => (n == null ? '-' : n.toFixed(2).replace('.', ','));
  const fmtDate = (d) => { if(!d) return ''; const p = d.split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0].slice(2) : d; };
  const fmtDateFull = (d) => { if(!d) return ''; const p = d.split('-'); if(p.length !== 3) return d; const months=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre']; return p[2]+' '+months[parseInt(p[1],10)-1]+' '+p[0]; };
  const rankLabel = (r) => (!r ? '-' : (r.rank===1 ? '1er' : r.rank+'e') + (r.ex ? ' ex' : ''));
  const validNoteNum = (v) => /^\d{0,2}([.,]\d{0,2})?$/.test(v);
  const col = (n, half) => (n == null ? '' : n >= half ? 'g' : 'r');
  const tcol = (n) => (n == null ? '' : n >= 10 ? 'tok' : 'tko');
  const coefLabel = (e) => (e.scale === 10 ? 'Sur 10 — coef 0,5' : 'Sur 20 — coef ' + e.coef);
  const nextCoef = (e) => e.scale === 10 ? { scale:20, coef:1 } : e.coef === 1 ? { scale:20, coef:2 } : { scale:10, coef:0.5 };
  const splitNames = (t) => t.split(/\n/).map((x)=>x.trim()).filter(Boolean).slice(0, NB_ELEVES);
  const mean = (arr) => { const v = arr.filter((x)=>x != null); return v.length ? Math.round((v.reduce((a,b)=>a+b,0)/v.length) * 100) / 100 : null; };
